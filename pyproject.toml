[project]
name = "typed-observational-memory"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "knowledge-triage",
    "pydantic>=2.0",
    "tiktoken>=0.7",
    "typesafe-sdk>=0.7.0",
]

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.7.0"]
eval = ["nltk>=3.9"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.11", "pyright>=1.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.uv.sources]
knowledge-triage = { git = "https://github.com/searchsim-org/cikm26-knowledge-triage", rev = "a6ceb01a3368cee25ef7ebcf05ebdab8c9be24a4" }
